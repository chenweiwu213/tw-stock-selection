name: Update disposition stocks

# 這個 workflow 只需要讀取 repo 程式碼，不需要寫入權限（最小權限原則）
permissions:
  contents: read

on:
  schedule:
    # UTC 13:00 = 台灣時間 21:00：收盤後，抓當天晚上公告的新處置股（明日起生效者）
    - cron: "0 13 * * 1-5"
    # UTC 01:00 = 台灣時間 09:00：開盤前再補抓一次，涵蓋晚間較晚才公告的更新
    - cron: "0 1 * * 1-5"
  workflow_dispatch: {}  # 允許手動觸發，方便部署後立即測試一次

jobs:
  update-disposition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update_disposition.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python update_disposition.py
