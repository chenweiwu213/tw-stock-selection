name: Update disposition stocks

# 這個 workflow 只需要讀取 repo 程式碼，不需要寫入權限(最小權限原則)
permissions:
  contents: read

on:
  # 不使用 GitHub 內建的 schedule(不保證準時，也可能完全不觸發)。
  # 改由 cron-job.org 在台灣時間週一到週五約 21:00(收盤後，抓當天晚上公告的新處置股)
  # 呼叫 GitHub API 觸發 workflow_dispatch，詳見 README「排程腳本」。
  # 也可在 Actions 頁面手動觸發。
  workflow_dispatch: {}

jobs:
  update-disposition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update_disposition.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python update_disposition.py