name: Update stock mention daily

# 這個 workflow 只需要讀取 repo 程式碼，不需要寫入權限(最小權限原則)
permissions:
  contents: read

on:
  schedule:
    # UTC 13:17 = 台灣時間 21:17(收盤後、CMoney熱門貼文已累積一天的討論量)
    # 分鐘刻意錯開整點(GitHub 整點排程最擁擠，容易延遲或被略過)；一天只執行一次
    - cron: "17 13 * * 1-5"  # 只在台灣時間週一到週五(UTC週一~五)跑，對應交易日
  workflow_dispatch: {}  # 允許手動觸發，方便部署後立即測試一次

jobs:
  update-stock-mention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update_stock_mention.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python update_stock_mention.py